<!DOCTYPE html>
<html lang="zh-TW">
<head>

<title>👑 你的隱藏佔有慾有多高？</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f3ee;--card:#fefdfA;
  --border:rgba(110,90,50,0.13);--border-h:rgba(110,90,50,0.28);
  --amber:#9a7840;--amber2:#c4a060;--amber-lt:#ead8b0;--cream:#faf4e8;
  --text:#2a2010;--muted:#6a5828;--faint:#c8b880;--gold:#a08030;
  --sel-bg:rgba(160,130,60,0.07);--sel-bd:rgba(160,130,60,0.38);
  --tag-bg:rgba(140,110,40,0.08);
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.022'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
.shape{position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:0.45}
.s1{width:560px;height:560px;background:radial-gradient(circle,#f0e0b0 0%,transparent 70%);top:-180px;right:-180px}
.s2{width:380px;height:380px;background:radial-gradient(circle,#e8d8f0 0%,transparent 70%);bottom:-80px;left:-120px}
.s3{width:260px;height:260px;background:radial-gradient(circle,#f8e8c0 0%,transparent 70%);top:42%;left:56%}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 28px 100px}

#intro{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:80px 0}
.eyebrow{font-size:10px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;margin-bottom:24px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:'';flex:0 0 28px;height:1px;background:var(--faint)}
.big-em{font-size:28px;margin-bottom:18px;display:block}
h1{font-family:'Noto Serif TC',serif;font-weight:200;font-size:clamp(26px,5vw,44px);line-height:1.45;color:var(--text);margin-bottom:10px;letter-spacing:.02em}
h1 em{font-style:normal;color:var(--amber);font-weight:300}
.sub{font-family:'Noto Serif TC',serif;font-size:13px;font-weight:300;color:var(--faint);letter-spacing:.12em;margin-bottom:36px}
.rule{width:1px;height:48px;background:linear-gradient(to bottom,transparent,var(--faint),transparent);margin:0 0 32px}
.desc{font-size:14px;line-height:2.2;color:var(--muted);font-weight:300;margin-bottom:48px;border-left:1px solid var(--amber-lt);padding-left:20px}
.desc p{margin-bottom:6px}
.btn-go{display:inline-flex;align-items:center;gap:14px;padding:15px 36px;background:var(--amber);border:none;border-radius:50px;color:#fff;font-family:'Noto Sans TC',sans-serif;font-size:13px;letter-spacing:.12em;cursor:pointer;transition:all .3s;box-shadow:0 4px 24px rgba(140,110,40,0.25)}
.btn-go:hover{background:var(--amber2);box-shadow:0 6px 32px rgba(140,110,40,0.35);transform:translateY(-1px)}
.btn-go svg{transition:transform .3s}
.btn-go:hover svg{transform:translateX(4px)}

#quiz{display:none;padding:60px 0}
.prog-row{display:flex;align-items:center;gap:16px;margin-bottom:48px}
.prog-bar{flex:1;height:1px;background:var(--amber-lt);border-radius:1px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--amber-lt),var(--amber));border-radius:1px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.prog-lbl{font-size:11px;color:var(--faint);letter-spacing:.08em;white-space:nowrap}
.qblock{animation:fadeup .5s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.qno{font-size:10px;letter-spacing:.25em;color:var(--faint);text-transform:uppercase;margin-bottom:16px}
.qtxt{font-family:'Noto Serif TC',serif;font-weight:300;font-size:clamp(17px,2.5vw,21px);line-height:1.8;color:var(--text);margin-bottom:32px;letter-spacing:.02em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:all .25s;box-shadow:0 1px 4px rgba(110,90,50,0.04)}
.opt:hover{border-color:var(--border-h);box-shadow:0 2px 12px rgba(110,90,50,0.1);transform:translateY(-1px)}
.opt.sel{border-color:var(--sel-bd);background:var(--sel-bg);box-shadow:0 2px 16px rgba(110,90,50,0.1)}
.opt-l{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-h);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint);flex-shrink:0;margin-top:2px;transition:all .25s;font-family:'Noto Serif TC',serif}
.opt.sel .opt-l{background:var(--amber);border-color:var(--amber);color:#fff}
.opt-main{display:flex;flex-direction:column;gap:4px}
.opt-t{font-size:14px;line-height:1.6;color:var(--muted);transition:color .25s;font-weight:500}
.opt-sub{font-size:12px;line-height:1.6;color:var(--faint);transition:color .25s;font-weight:300}
.opt:hover .opt-t,.opt.sel .opt-t{color:var(--text)}
.opt:hover .opt-sub,.opt.sel .opt-sub{color:var(--muted)}
.btn-nxt{margin-top:32px;display:inline-flex;align-items:center;gap:10px;padding:13px 28px;background:transparent;border:1px solid var(--border-h);border-radius:50px;color:var(--faint);font-family:'Noto Sans TC',sans-serif;font-size:13px;letter-spacing:.06em;cursor:pointer;transition:all .3s;opacity:.4;pointer-events:none}
.btn-nxt.on{opacity:1;pointer-events:all;color:var(--amber);border-color:var(--amber)}
.btn-nxt.on:hover{background:var(--cream);color:var(--text)}

#result{display:none;padding:60px 0;animation:fadeup .6s ease both}
.res-eyebrow{font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.res-eyebrow::after{content:'';flex:0 0 28px;height:1px;background:var(--faint)}
.res-emoji{font-size:30px;margin-bottom:14px;display:block}
.res-type{font-family:'Noto Serif TC',serif;font-weight:300;font-size:clamp(24px,4vw,36px);color:var(--text);margin-bottom:8px;letter-spacing:.04em}
.res-type span{color:var(--amber)}

/* score bar */
.score-wrap{margin:20px 0 28px}
.score-label{font-size:11px;color:var(--faint);letter-spacing:.1em;margin-bottom:10px}
.score-bar-bg{width:100%;height:8px;background:var(--amber-lt);border-radius:8px;overflow:hidden}
.score-bar-fill{height:100%;background:linear-gradient(90deg,var(--amber-lt),var(--amber));border-radius:8px;transition:width 1s cubic-bezier(.4,0,.2,1)}
.score-num{font-size:12px;color:var(--muted);margin-top:8px;text-align:right}

.res-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.res-tag{padding:5px 14px;background:var(--tag-bg);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--amber);letter-spacing:.06em;font-family:'Noto Serif TC',serif}
.res-rule{width:100%;height:1px;background:var(--border);margin-bottom:24px}
.res-body{font-size:15px;line-height:2.2;color:var(--muted);margin-bottom:36px;font-weight:300;font-family:'Noto Serif TC',serif}
.res-body p{margin-bottom:10px}

.match-card{background:var(--card);border:1px solid var(--border-h);border-radius:18px;padding:26px 28px;margin-bottom:48px;position:relative;overflow:hidden;box-shadow:0 2px 20px rgba(110,90,50,0.06)}
.match-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--amber-lt),var(--amber),var(--amber-lt))}
.match-lbl{font-size:10px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.match-pair{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.match-you,.match-them{font-family:'Noto Serif TC',serif;font-size:14px;color:var(--amber);font-weight:300}
.match-x{font-size:13px;color:var(--faint)}
.match-name{font-family:'Noto Serif TC',serif;font-size:19px;font-weight:300;color:var(--text);margin-bottom:12px;letter-spacing:.04em}
.match-why{font-size:13px;line-height:2;color:var(--muted);font-weight:300}

.btn-retry{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;background:transparent;border:1px solid var(--border-h);border-radius:50px;color:var(--muted);font-family:'Noto Sans TC',sans-serif;font-size:13px;letter-spacing:.06em;cursor:pointer;transition:all .3s}
.btn-retry:hover{background:var(--cream);color:var(--amber);border-color:var(--amber)}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--amber);color:#fff;padding:10px 24px;border-radius:50px;font-size:13px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div>
<div class="toast" id="toast">資料已送出 ✓</div>
<div class="wrap">

<section id="intro">
  <p class="eyebrow">佔有慾測驗</p>
  <span class="big-em">👑</span>

</div>

  {q:'你理想中的關係是？',opts:[
    {l:'A',t:'各自有生活，需要時在彼此身邊',sub:'有空間才有想念',sc:0},
    {l:'B',t:'日常有聯繫，但不需要報告行蹤',sub:'聯繫感很重要',sc:1},
    {l:'C',t:'感覺到彼此是對方最重要的人',sub:'這種確定感讓你安心',sc:2},
    {l:'D',t:'生活高度重疊，彼此都是第一順位',sub:'越黏越有安全感',sc:3}
  ]},
  {q:'你覺得吃醋是？',opts:[
    {l:'A',t:'沒必要，信任才是基礎',sub:'吃醋代表不信任',sc:0},
    {l:'B',t:'偶爾有一點點，但不會表現出來',sub:'心裡有但不說',sc:1},
    {l:'C',t:'正常的，代表在乎',sub:'不吃醋才奇怪',sc:2},
    {l:'D',t:'我的愛就是會帶點佔有慾',sub:'這是你愛的方式',sc:3}
  ]}
];

let cur=0,totalScore=0,picked=false,answers=[],curScore=0;

function startQuiz(){
  document.getElementById('intro').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
}

function render(){
  picked=false;
  const q=QS[cur];
  document.getElementById('pfill').style.width=(cur/QS.length*100+4)+'%';
  document.getElementById('ptxt').textContent=(cur+1)+' / '+QS.length;
  const b=document.getElementById('qblock');
  b.innerHTML=`
    <p class="qno">Question ${String(cur+1).padStart(2,'0')}</p>
    <p class="qtxt">${q.q}</p>
    <div class="opts">${q.opts.map(o=>`
      <div class="opt" data-sc="${o.sc}" data-label="${o.t}" onclick="pick(this)">
        <div class="opt-l">${o.l}</div>
        <div class="opt-main">
          <div class="opt-t">${o.t}</div>
          <div class="opt-sub">${o.sub}</div>
        </div>
      </div>`).join('')}
    </div>
    <button class="btn-nxt" id="bnxt" onclick="next()">
      ${cur<QS.length-1?'下一題':'看結果'}
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>`;
  b.style.animation='none';b.offsetHeight;b.style.animation='fadeup .45s ease both';
}

function pick(el){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('bnxt').classList.add('on');
  picked=true;
  curScore=parseInt(el.dataset.sc);
}

function next(){
  if(!picked)return;
  const sel=document.querySelector('.opt.sel');
  totalScore+=parseInt(sel.dataset.sc);
  answers.push({question:QS[cur].q,answer:sel.dataset.label});
  cur++;
  if(cur>=QS.length)showResult();else render();
}

function getResult(){
  return RESULTS.find(r=>totalScore>=r.min&&totalScore<=r.max)||RESULTS[RESULTS.length-1];
}

function showResult(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('result').style.display='block';
  const r=getResult();
  const maxScore=30;
  const pct=Math.round(totalScore/maxScore*100);

  document.getElementById('remoji').textContent=r.emoji;
  document.getElementById('rtype').innerHTML=`<span>${r.type}</span>`;
  document.getElementById('rtags').innerHTML=r.keys.map(k=>`<span class="res-tag">${k}</span>`).join('');
  document.getElementById('rbody').innerHTML=r.body.split('。').filter(Boolean).map(s=>`<p>${s}。</p>`).join('');
  document.getElementById('snum').textContent=`${totalScore} / ${maxScore} 分`;
  document.getElementById('myou').textContent=r.type;
  document.getElementById('mthem').textContent=r.matchType+' '+r.matchEmoji;
  document.getElementById('mname').textContent=r.matchType;
  document.getElementById('mwhy').textContent=r.why;

  setTimeout(()=>{
    document.getElementById('sbar').style.width=pct+'%';
  },300);

  const payload={result:r.type,score:totalScore};
  answers.forEach((a,i)=>{payload['Q'+(i+1)]=a.answer;});
  fetch(FORMSPREE,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)})
    .then(()=>{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);})
    .catch(()=>{});
}

function resetQuiz(){
  cur=0;totalScore=0;picked=false;answers=[];curScore=0;
  document.getElementById('result').style.display='none';
  document.getElementById('sbar').style.width='0%';
  document.getElementById('quiz').style.display='block';
  render();
}
</script>
</body>
</html>
